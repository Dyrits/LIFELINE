<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Lifeline · Dylan J. Gerrits</title>
    <meta content="Dylan J. Gerrits: a life and a career, drawn as a single line." name="description">
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="off" id="cards"></div>
    <div id="cap"></div>
    <div id="prog"></div>
    <div id="hud">
      <div aria-hidden="true" id="year"></div>
      <div class="row">
        <button aria-keyshortcuts="Space" class="mono chrome" id="pause" type="button"></button>
        <span class="mono" data-i18n="hint" id="hint"></span>
      </div>
    </div>
    <button class="mono chrome" data-i18n="back" id="back" type="button"></button>
    <div class="chrome-group" id="top">
      <button aria-label="Langue / Language" class="mono chrome" id="lang" type="button">
        <span data-lang="fr">FR</span>
        · <span data-lang="en">EN</span>
      </button>
      <button class="mono chrome" id="snd" type="button"></button>
    </div>
    <button class="mono" data-i18n="again" id="again" type="button"></button>

    <div id="intro">
      <h1>Lifeline</h1>
      <svg aria-hidden="true" viewBox="0 0 460 70">
        <path d="M0 45 H150 L160 38 L170 45 H190 L196 52 L206 4 L216 62 L224 45 H250 L262 34 L276 45 H460" />
        <path class="r" d="M0 49 H150 L160 42 L170 49 H190 L196 56 L206 8 L216 66 L224 49 H250 L262 38 L276 49 H460" />
      </svg>
      <p class="who">Dylan J. Gerrits</p>
      <p class="tagline" data-i18n="tagline"></p>
      <nav class="paths">
        <button class="path" disabled id="path-life" type="button">
          <span data-i18n="life"></span> <small class="mono" data-i18n="soon"></small>
        </button>
        <span aria-hidden="true" class="sep">|</span>
        <button class="path" id="path-career" type="button"><span data-i18n="career"></span></button>
      </nav>
      <span class="mono call" data-i18n="choose"></span>
    </div>

    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
